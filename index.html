<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 潮人挑戰 • 每日一格</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-pink: #FF00FF;
            --neon-blue: #00FFFF;
            --neon-green: #39FF14;
            --cyber-purple: #8A2BE2;
            --matrix-green: #00FF41;
            --dark-bg: #0A0A0A;
            --card-bg: rgba(20, 20, 30, 0.9);
            --glass: rgba(255, 255, 255, 0.1);
            --holiday: #FF4757;
            --fire: #FF6B00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(57, 255, 20, 0.1) 0%, transparent 50%);
            color: white;
            min-height: 100vh;
            font-family: 'Noto Sans TC', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.03) 0px,
                rgba(0, 255, 255, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: -1;
        }

        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -2;
            opacity: 0.1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* 霓虹標頭 */
        .neon-header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
            position: relative;
            border-bottom: 3px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
            background: rgba(10, 10, 20, 0.8);
            border-radius: 20px;
            overflow: hidden;
        }

        .neon-header::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                var(--neon-pink), 
                var(--neon-blue), 
                var(--neon-green),
                var(--neon-pink));
            z-index: -1;
            filter: blur(10px);
            animation: neonBorder 3s linear infinite;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 3.5rem;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 15px;
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--neon-green);
            font-weight: 500;
            margin-bottom: 10px;
        }

        .hk-tag {
            display: inline-block;
            background: var(--neon-pink);
            color: black;
            padding: 5px 15px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 0 5px;
            animation: float 3s ease-in-out infinite;
        }

        /* 時空顯示器 */
        .time-machine {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .time-display {
            background: var(--card-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .time-display::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            animation: scan 3s linear infinite;
        }

        #current-time {
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            color: var(--matrix-green);
            text-shadow: 0 0 10px var(--matrix-green);
            margin: 10px 0;
        }

        #current-date {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 15px var(--neon-pink);
            margin: 10px 0;
        }

        .auto-update {
            color: var(--neon-green);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* 任務卡片 - Cyberpunk風格 */
        .cyber-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .cyber-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            z-index: -1;
            border-radius: 22px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cyber-card:hover::before {
            opacity: 1;
        }

        .cyber-card.holiday {
            border-color: var(--holiday);
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.3);
        }

        .cyber-card.completed {
            border-color: var(--matrix-green);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        .task-badge {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1rem;
            background: linear-gradient(45deg, var(--cyber-purple), var(--neon-pink));
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .task-badge::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        .task-content {
            font-size: 1.8rem;
            line-height: 1.6;
            margin: 30px 0;
            padding: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border-left: 5px solid var(--neon-blue);
            position: relative;
        }

        .task-emoji {
            font-size: 3rem;
            margin-right: 20px;
            filter: drop-shadow(0 0 10px currentColor);
        }

        /* 心情選擇 - 遊戲化 */
        .mood-arena {
            background: linear-gradient(45deg, rgba(138, 43, 226, 0.2), rgba(255, 0, 255, 0.2));
            border-radius: 20px;
            padding: 25px;
            margin: 25px 0;
            border: 2px solid var(--neon-pink);
        }

        .mood-title {
            font-size: 1.5rem;
            color: var(--neon-blue);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .emoji-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid transparent;
            border-radius: 15px;
            width: 90px;
            height: 90px;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .emoji-btn:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
        }

        .emoji-btn.selected {
            transform: scale(1.15);
            border-color: var(--neon-pink);
            box-shadow: 0 0 30px var(--neon-pink);
            background: rgba(255, 0, 255, 0.2);
        }

        .emoji-label {
            position: absolute;
            bottom: 5px;
            font-size: 0.8rem;
            color: var(--neon-green);
            font-weight: bold;
        }

        /* 搞笑鼓勵訊息 */
        .funny-message {
            margin: 20px 0;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
            border: 2px dashed var(--neon-green);
            background: rgba(57, 255, 20, 0.1);
        }

        .funny-message.positive {
            border-color: var(--neon-blue);
            background: rgba(0, 255, 255, 0.1);
            color: var(--neon-blue);
        }

        .funny-message.negative {
            border-color: var(--fire);
            background: rgba(255, 107, 0, 0.1);
            color: var(--fire);
        }

        /* 動作按鈕 */
        .action-station {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .cyber-btn {
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .cyber-btn:hover::before {
            left: 100%;
        }

        .complete-btn {
            background: linear-gradient(45deg, var(--matrix-green), #00CC00);
            color: black;
        }

        .complete-btn.completed {
            background: linear-gradient(45deg, #666, #999);
            color: #CCC;
        }

        .share-btn {
            background: linear-gradient(45deg, #8A2BE2, #FF00FF);
            color: white;
        }

        /* 社交分享 - 懸浮面板 */
        .social-hologram {
            display: none;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 2px solid var(--neon-blue);
            animation: hologramFloat 3s ease-in-out infinite;
        }

        .social-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .social-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -40px;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .social-btn:hover::after {
            opacity: 1;
        }

        .social-btn:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 5px 20px currentColor;
        }

        .fb { background: #1877F2; border-color: #1877F2; }
        .ig { background: linear-gradient(45deg, #833AB4, #E1306C, #F77737); border-color: #E1306C; }
        .wa { background: #25D366; border-color: #25D366; }
        .tg { background: #0088cc; border-color: #0088cc; }
        .tt { background: #000000; border-color: #FFFFFF; }
        .dc { background: #5865F2; border-color: #5865F2; }

        /* 數據分析 - 全息投影 */
        .hologram-stats {
            margin-top: 50px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-radius: 25px;
            border: 2px solid var(--neon-pink);
            position: relative;
            overflow: hidden;
        }

        .hologram-stats::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.05) 2px,
                rgba(255, 255, 255, 0.05) 4px
            );
            pointer-events: none;
        }

        .stats-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .hologram-tab {
            padding: 12px 25px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-blue);
            border-radius: 50px;
            color: var(--neon-blue);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .hologram-tab.active {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .hologram-tab:hover {
            transform: translateY(-3px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-cell {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid var(--neon-green);
            position: relative;
            overflow: hidden;
        }

        .stat-cell::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, var(--neon-green), transparent);
            opacity: 0.1;
            transform: rotate(45deg);
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--neon-green);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chart-hologram {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            padding: 20px;
            height: 400px;
            border: 2px solid var(--cyber-purple);
            position: relative;
        }

        /* 進度條 - 能量槽 */
        .energy-bar {
            margin-top: 40px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            border: 2px solid var(--fire);
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .energy-container {
            height: 30px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--matrix-green);
            position: relative;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--fire), #FFD700);
            border-radius: 15px;
            width: 0%;
            transition: width 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }

        .energy-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: energyFlow 2s infinite;
        }

        /* 動畫 */
        @keyframes neonBorder {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink); }
            to { text-shadow: 0 0 30px var(--neon-blue), 0 0 40px var(--neon-blue); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes hologramFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes energyFlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes matrixRain {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .time-machine { flex-direction: column; }
            .action-station { grid-template-columns: 1fr; }
            .emoji-grid { grid-template-columns: repeat(3, 1fr); }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .emoji-btn { width: 80px; height: 80px; font-size: 2.5rem; }
        }

        /* 通知動畫 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            color: black;
            padding: 20px 30px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.5s ease, slideOut 0.5s ease 2.5s forwards;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* 霓虹文字特效 */
        .neon-text {
            color: #fff;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--neon-pink),
                0 0 30px var(--neon-pink),
                0 0 40px var(--neon-pink);
            animation: flicker 1.5s infinite alternate;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow:
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 20px var(--neon-pink),
                    0 0 30px var(--neon-pink),
                    0 0 40px var(--neon-pink);
            }
            20%, 24%, 55% {
                text-shadow: none;
            }
        }
    </style>
</head>
<body>
    <!-- 矩陣雨效果 -->
    <div class="matrix-rain" id="matrixRain"></div>

    <div class="container">
        <!-- 霓虹標頭 -->
        <header class="neon-header">
            <h1>2026 潮人挑戰</h1>
            <div class="subtitle">每日一格 • 挑戰自我 • 記錄心情</div>
            <div>
                <span class="hk-tag">🇭🇰 香港限定</span>
                <span class="hk-tag">🔥 潮人必玩</span>
                <span class="hk-tag">😂 笑住挑戰</span>
            </div>
        </header>

        <!-- 時空顯示器 -->
        <section class="time-machine">
            <div class="time-display">
                <div>🕒 當前時間</div>
                <div id="current-time" class="neon-text">載入中...</div>
                <div class="auto-update">⏰ 自動更新：每日00:00刷新</div>
            </div>
            
            <div class="time-display">
                <div>📅 挑戰日期</div>
                <div id="current-date">載入中...</div>
                <div id="day-counter" class="auto-update">第 0 天</div>
            </div>
        </section>

        <!-- 任務卡片 -->
        <section id="task-container">
            <!-- 由JavaScript動態生成 -->
        </section>

        <!-- 數據分析全息投影 -->
        <section class="hologram-stats">
            <h2 style="color: var(--neon-blue); margin-bottom: 20px; text-align: center;">
                📊 心情數據全息分析
            </h2>
            
            <div class="stats-tabs">
                <button class="hologram-tab active" onclick="showStats('month')">📈 本月統計</button>
                <button class="hologram-tab" onclick="showStats('year')">🎯 全年總結</button>
                <button class="hologram-tab" onclick="showStats('moods')">😎 心情圖譜</button>
                <button class="hologram-tab" onclick="showStats('trends')">📈 趨勢分析</button>
            </div>

            <div class="stats-grid">
                <div class="stat-cell">
                    <div class="stat-value" id="total-days">0</div>
                    <div class="stat-label">打卡日數</div>
                </div>
                <div class="stat-cell">
                    <div class="stat-value" id="completion-rate">0%</div>
                    <div class="stat-label">完成率</div>
                </div>
                <div class="stat-cell">
                    <div class="stat-value" id="happy-days">0</div>
                    <div class="stat-label">開心日子</div>
                </div>
                <div class="stat-cell">
                    <div class="stat-value" id="streak">0</div>
                    <div class="stat-label">連續打卡</div>
                </div>
            </div>

            <div class="chart-hologram">

        // ========== 矩陣雨效果 ==========
        function createMatrixRain() {
            const canvas = document.createElement('canvas');
            canvas.className = 'matrix-rain';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.getElementById('matrixRain').appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);
            
            function drawMatrix() {
                ctx.fillStyle = 'rgba(10, 10, 20, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#0F0';
                ctx.font = `${fontSize}px monospace`;
                
                drops.forEach((y, i) => {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    const x = i * fontSize;
                    ctx.fillText(text, x, y * fontSize);
                    
                    if (y * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                });
            }
            
            setInterval(drawMatrix, 50);
            
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            // 創建唯一種子
            const seed = year * 10000 + month * 100 + day;
            const taskIndex = Math.abs(seed * 9301 + 49297) % ultraCoolTasks.length;
            
            // 檢查是否節日
            const dateKey = `${month}/${day}`;
            if (holidaysHK2026[dateKey]) {
                return holidaysHK2026[dateKey].special;
            }
            
            return ultraCoolTasks[taskIndex];
        }

            if (task.includes('笑') || task.includes('開心')) return '😂';
            if (task.includes('運動') || task.includes('做')) return '💪';
            if (task.includes('莫生氣')) return '🧘';

            if (task.includes('Taylor')) return '🪩';
            if (task.includes('醜')) return '🤡';
            return '🎯';
        }

                checkDate.setDate(checkDate.getDate() - i);
                const dateStr = formatCyberDate(checkDate).replace(/\//g, '-');
                
                if (completedDays[dateStr]) {
                    streak++;
                } else {
                    break;
                }
            }
            
            const percent = Math.round((completedCount / totalDays) * 100);
            
            document.getElementById('completed-days').textContent = completedCount;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress-percent').textContent = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function updateMoodStats() {
            const moodCounts = {};
            let totalDays = 0;
            let happyDays = 0;
            
            // 初始化計數器
            moodVibes.forEach(mood => {
                moodCounts[mood.emoji] = 0;
            });
            
            // 統計心情
            Object.values(moodRecords).forEach(record => {
                if (moodCounts[record.emoji] !== undefined) {
                    moodCounts[record.emoji]++;
                }
                totalDays++;
                
                // 計算開心日子
                const moodType = moodVibes.find(m => m.emoji === record.emoji)?.type;
                if (moodType === 'positive') {
                    happyDays++;
                }
            });
            
            const completedTasks = Object.keys(completedDays).filter(key => completedDays[key]).length;
            const completionRate = totalDays > 0 ? Math.round((completedTasks / totalDays) * 100) : 0;
            
            // 更新統計數字
            document.getElementById('total-days').textContent = totalDays;
            document.getElementById('happy-days').textContent = happyDays;
            document.getElementById('completion-rate').textContent = `${completionRate}%`;
            
            // 更新圖表
            updateMoodChart(moodCounts);
            
            // 更新詳細統計
            updateMoodDetails(moodCounts);
        }

        function updateMoodChart(moodCounts) {
            const ctx = document.getElementById('moodChart').getContext('2d');
            
            if (moodChart) {
                moodChart.destroy();
            }
            
            const labels = [];
            const data = [];
            const colors = [];
            const hoverColors = [];
            
            moodVibes.forEach(mood => {
                const count = moodCounts[mood.emoji] || 0;
                if (count > 0) {
                    labels.push(`${mood.emoji} ${mood.label}`);
                    data.push(count);
                    
                    // 根據類型設定顏色
                    switch(mood.type) {
                        case 'positive':
                            colors.push('#00FFFF');
                            hoverColors.push('#00CCCC');
                            break;
                        case 'negative':
                            colors.push('#FF00FF');
                            hoverColors.push('#CC00CC');
                            break;
                        default:
                            colors.push('#39FF14');
                            hoverColors.push('#00CC00');
                    }
                }
            });
            
            // 如果沒有數據
            if (data.length === 0) {
                labels.push('尚未記錄');
                data.push(1);
                colors.push('#666666');
                hoverColors.push('#888888');
            }
            
            moodChart = new Chart(ctx, {
                type: 'polarArea',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderColor: colors.map(c => c.replace('0.8', '1')),
                        borderWidth: 2,
                        hoverBackgroundColor: hoverColors
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#00FFFF',
                                font: {
                                    size: 12,
                                    family: "'Courier New', monospace"
                                }
                            }
                        }
                    },
                    scales: {
                        r: {
                            grid: {
                                color: 'rgba(0, 255, 255, 0.2)'
                            },
                            ticks: {
                                color: '#39FF14',
                                backdropColor: 'transparent'
                            }
                        }
                    }
                }
            });
        }

        function updateMoodDetails(moodCounts) {
            const container = document.getElementById('mood-stats');
            let html = '<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">';
            
            moodVibes.forEach(mood => {
                const count = moodCounts[mood.emoji] || 0;
                if (count > 0) {
                    html += `
                        <div style="background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; border: 1px solid ${mood.type === 'positive' ? '#00FFFF' : mood.type === 'negative' ? '#FF00FF' : '#39FF14'}">
                            ${mood.emoji} ${mood.label}: ${count}次
                        </div>
                    `;
                }
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function updateEnergyLevel() {
            const completedCount = Object.keys(completedDays).filter(key => completedDays[key]).length;
            let level = "新手";
            let color = "#666";
            
            if (completedCount >= 100) {
                level = "🔥 傳奇";
                color = "#FF0000";
            } else if (completedCount >= 50) {
                level = "💪 高手";
                color = "#FF9900";
            } else if (completedCount >= 20) {
                level = "⚡ 進階";
                color = "#00FF00";
            } else if (completedCount >= 5) {
                level = "✨ 入門";
                color = "#00FFFF";
            }
            
            const levelElement = document.getElementById('energy-level');
            levelElement.textContent = level;
            levelElement.style.color = color;
            levelElement.style.textShadow = `0 0 10px ${color}`;
        }

        function showStats(period) {
            // 更新活躍標籤
            document.querySelectorAll('.hologram-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            // 這裡可以根據不同期間顯示不同數據
            updateAllCyberStats();
        }

        // ========== 工具函數 ==========
        function formatCyberDate(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${year}.${month.toString().padStart(2, '0')}.${day.toString().padStart(2, '0')}`;
        }

        function checkIfHoliday(date) {
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return !!holidaysHK2026[`${month}/${day}`];
        }

        function showCyberNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
